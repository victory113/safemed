# Continuous integration for SafeMed.
#
# Runs on every push and every pull request, so a branch is known to be green
# before anyone reviews it. The two jobs are independent and run in parallel -
# a frontend type error should not hide a backend test failure, or the reverse.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first run still in progress.
# Only the latest commit's result is of any interest, and the free runner
# minutes are finite.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    # The suite talks to a real PostgreSQL rather than SQLite, because the
    # application does: it relies on server-side defaults and on real
    # constraint behaviour. Testing against a different database would mean
    # testing something we do not ship.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: safemed
          POSTGRES_PASSWORD: safemed
          POSTGRES_DB: safemed
        ports:
          - 5432:5432
        # Without this the test step can start before Postgres accepts
        # connections, and the whole job fails for no real reason.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # conftest.py derives the test database from this, swapping the final
      # path segment for safemed_test, and creates it on first run.
      DATABASE_URL: postgresql+psycopg://safemed:safemed@localhost:5432/safemed
      # The application refuses to start without a SECRET_KEY and has no
      # default, on purpose. This value is for this throwaway CI run only; the
      # real one is never committed.
      SECRET_KEY: ci-only-not-a-real-secret
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"       # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest

      # The test suite builds the schema straight from the models with
      # create_all() and never touches Alembic, so a broken migration used to
      # pass CI untouched - and a migration nobody can run is a deploy nobody
      # can do. Adding this found a real one: the initial schema's downgrade
      # dropped its tables but left eleven ENUM types behind, so the second
      # upgrade died on `type "user_role" already exists`.
      #
      # upgrade / downgrade / upgrade, because a migration that only goes one
      # way is a deploy you cannot roll back.
      - name: Migrations apply and reverse cleanly
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the versions in
      # the lock file and fails if the lock file disagrees with package.json,
      # so CI can never pass against dependencies no one has committed.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Type errors first. They are the cheapest to fix and they tend to be
      # the cause of whatever else is failing.
      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

  # Everything above tests the application. None of it tested the thing that
  # ships it: the backend job installs Python on the runner and never builds
  # backend/Dockerfile, so until this job existed the image was an artifact
  # nothing checked. Break the Dockerfile and CI stayed green while
  # `docker compose up` failed on every machine.
  #
  # This is the same gap as the migration one, one layer out. The question
  # worth asking repeatedly: which artifact did the green build exercise, and
  # which ones did it not?
  deploy-path:
    name: Container builds and starts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The two commands the README actually gives a new contributor. Nothing
      # CI-specific except the generated key, because the point is to test the
      # documented path rather than a convenient approximation of it.
      - name: Create .env from the committed template
        run: |
          cp .env.example .env
          key=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$key|" .env
          # If the template's placeholder survives, the app will boot with a
          # key everyone can read. Fail here rather than pass a broken check.
          if grep -q "^SECRET_KEY=change-me" .env; then
            echo "SECRET_KEY placeholder was not replaced"
            exit 1
          fi
          echo ".env written, SECRET_KEY generated"

      - name: Build the images
        run: docker compose build

      # compose mounts ./backend over /app at runtime for live reload, which
      # masks the image's own copy of the code. So check the image on its own,
      # with no mount: a Dockerfile that forgot to COPY something would pass
      # the compose check below and then fail anywhere without the source.
      - name: The image contains a working application
        run: |
          docker build -t safemed-api:ci ./backend
          docker run --rm \
            -e SECRET_KEY=ci-only-not-a-real-secret \
            -e DATABASE_URL=postgresql+psycopg://u:p@db:5432/d \
            safemed-api:ci python -c "import app.main; print('import ok')"

      - name: Start the stack
        run: docker compose up -d

      - name: Every service is running
        run: |
          running=$(docker compose ps --services --status running | sort | tr '\n' ' ')
          echo "running: $running"
          for s in api beat db redis worker; do
            case " $running " in
              *" $s "*) ;;
              *) echo "NOT RUNNING: $s"; docker compose logs --tail 40 "$s"; exit 1 ;;
            esac
          done

      # A container that is "running" has not necessarily served anything. The
      # api has no healthcheck in compose, so poll it.
      - name: The API answers /health
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then echo; exit 0; fi
            sleep 2
          done
          echo "api never answered /health"
          docker compose ps
          docker compose logs --tail 60 api
          exit 1

      # if: always() so a failure above still tears the stack down rather than
      # leaving the runner's volumes behind.
      - name: Stop the stack
        if: always()
        run: docker compose down -v
