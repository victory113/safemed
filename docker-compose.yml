# SafeMed - local development stack.
# Start everything with:  docker compose up --build
# Stop with Ctrl+C, or:   docker compose down

services:

  # ---- PostgreSQL: the system of record -------------------------------
  db:
    image: postgres:16-alpine
    container_name: safemed-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"          # host 5433 -> container 5432 (5432 may be taken)
    volumes:
      - safemed_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Redis: message broker for the background worker ----------------
  redis:
    image: redis:7-alpine
    container_name: safemed-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- FastAPI application --------------------------------------------
  api:
    build: ./backend
    container_name: safemed-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ENVIRONMENT: ${ENVIRONMENT}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app        # live code reload during development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  safemed_pgdata:
